name: Configuration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install StyLua
        run: cargo install stylua --version 2.6.0 --locked
      - name: Check Lua formatting and syntax
        run: stylua --check .
      - name: Validate JSON
        run: |
          python3 -m json.tool lazyvim.json > /dev/null
          python3 -m json.tool lazy-lock.json > /dev/null
          python3 -m json.tool .neoconf.json > /dev/null
